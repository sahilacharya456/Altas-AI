name: AltasAI CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install ML service dependencies
        run: pip install -r backend/ml-service/requirements.txt

      - name: Typecheck workspaces
        run: npm run typecheck --workspaces --if-present

      - name: Run tests
        run: npm test --workspaces --if-present

      - name: Build backend
        run: npm run build --workspace=@altasai/backend

      - name: Evaluate AltasAI internal models
        run: npm run evaluate:altasai --workspace=@altasai/backend

      - name: Train Python ML service models
        run: npm run ml:train

      - name: Evaluate Python ML service
        run: npm run ml:evaluate

      - name: Test Python ML service
        run: npm run ml:test

      - name: Firestore emulator security tests
        run: npm run test:rules --workspace=@altasai/backend

      - name: Audit high severity vulnerabilities
        run: npm audit --audit-level=high
